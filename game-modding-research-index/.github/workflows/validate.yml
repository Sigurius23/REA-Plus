name: Validate catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog and documentation consistency
        run: python scripts/validate_catalog.py
      - name: Build and verify distribution archive
        run: python scripts/build_archive.py --output "$RUNNER_TEMP/game-modding-research-index.zip"
