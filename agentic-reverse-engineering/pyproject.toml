[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aere-workbench"
version = "0.2.0"
description = "Evidence-first local Android APK and Steam install reverse-engineering workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AERE contributors" }]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.6,<2"]
dev = ["pytest>=8.0", "jsonschema>=4.20"]

[project.scripts]
aere = "aere.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/aere-workbench/schemas" = ["schemas/evidence-bundle.v1.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
